name: Stack Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # GHC 8.0.2's haddock reads source files in the locale encoding, so a
    # non-UTF-8 locale makes it die on non-ASCII bytes in dependency comments
    # ("hGetContents: invalid argument"). GitHub runners already set this;
    # pinning it keeps the build reproducible elsewhere too.
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      # Pinned: this project's resolver (lts-8.24) uses GHC 8.0.2 / Cabal
      # 1.24, and Stack 3.x dropped support for Cabal versions below 2.2.
      # 2.15.5 is the newest release that can still build it.
      - name: Set up Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: '2.15.5'

      - name: Build
        run: stack build --fast
        
      - name: test
        run: stack test --fast --haddock-deps 
