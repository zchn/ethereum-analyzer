name: Test Examples

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evm-cfg:
    name: EVM CFG Generation
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgmp-dev

      # Pinned: this project's resolver (lts-8.24) uses GHC 8.0.2 / Cabal
      # 1.24, and Stack 3.x dropped support for Cabal versions below 2.2.
      # 2.15.5 is the newest release that can still build it.
      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: '2.15.5'

      - name: Generate EVM CFG
        run: |
          mkdir -p work/
          stack build
          cat examples/etherscan.io/CryptoKittiesSalesAuction.evm | stack exec -- ea-bytecode-vis --outDot=work/tmp.dot
          dot -Tpng work/tmp.dot -O

      - name: Verify output existence
        run: |
          # Check if dot file was generated
          test -f work/tmp.dot || exit 1
          # Check if PNG file was generated
          test -f work/tmp.dot.png || exit 1

      - name: Upload dot files
        uses: actions/upload-artifact@v4
        with:
          name: evm-cfg-dot-files
          path: work/*.dot

      - name: Verify output correctness
        run: |
          # Compare generated dot file with expected one
          if ! diff -u work/tmp.dot test/expected/evm_cfg.dot; then
            echo "Generated EVM CFG dot file does not match expected output"
            exit 1
          fi
