name: Test Examples

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  solidity-cfg:
    name: Solidity CFG Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          sudo wget -O /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.4.24/solc-static-linux
          sudo chmod +x /usr/local/bin/solc

      - name: Set up Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Generate Solidity CFG
        run: |
          mkdir -p work/
          stack build --profile
          solc --combined-json ast examples/etherscan.io/CryptoKittiesCore.sol | stack exec -- ea-analyze
          find work/ -name "*.dot" -exec dot -Tpng -O {} \;

      - name: Verify output existence
        run: |
          # Check if dot files were generated
          test -n "$(find work/ -name '*.dot')" || exit 1
          # Check if PNG files were generated
          test -n "$(find work/ -name '*.dot.png')" || exit 1

      - name: Upload dot files
        uses: actions/upload-artifact@v3
        with:
          name: solidity-cfg-dot-files
          path: work/*.dot

      - name: Verify output correctness
        run: |
          # Compare generated dot files with expected ones
          for f in work/*.dot; do
            filename=$(basename "$f")
            if ! diff -u "$f" "test/expected/$filename"; then
              echo "Generated dot file $filename does not match expected output"
              exit 1
            fi
          done

  solidity-linter:
    name: Solidity Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo wget -O /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.4.24/solc-static-linux
          sudo chmod +x /usr/local/bin/solc

      - name: Set up Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Run Solidity Linter and Verify Output
        run: |
          stack build --profile
          output=$(solc --combined-json ast examples/analysis-benchmark/selfdestruct-over-suicide.sol | stack exec -- ea-analyze 2>&1)
          echo "$output"
          if ! echo "$output" | grep -q "Prefer 'selfdestruct' over 'suicide'"; then
            echo "Expected error message not found in output"
            exit 1
          fi

      - name: Upload dot files
        uses: actions/upload-artifact@v3
        with:
          name: solidity-linter-dot-files
          path: work/*.dot

  evm-cfg:
    name: EVM CFG Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Generate EVM CFG
        run: |
          mkdir -p work/
          stack build
          cat examples/etherscan.io/CryptoKittiesSalesAuction.evm | stack exec -- ea-bytecode-vis --outDot=work/tmp.dot
          dot -Tpng work/tmp.dot -O

      - name: Verify output existence
        run: |
          # Check if dot file was generated
          test -f work/tmp.dot || exit 1
          # Check if PNG file was generated
          test -f work/tmp.dot.png || exit 1

      - name: Upload dot files
        uses: actions/upload-artifact@v3
        with:
          name: evm-cfg-dot-files
          path: work/*.dot

      - name: Verify output correctness
        run: |
          # Compare generated dot file with expected one
          if ! diff -u work/tmp.dot test/expected/evm_cfg.dot; then
            echo "Generated EVM CFG dot file does not match expected output"
            exit 1
          fi
