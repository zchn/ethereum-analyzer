name: Test Examples

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  solidity-cfg:
    name: Solidity CFG Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          sudo wget -O /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.4.24/solc-static-linux
          sudo chmod +x /usr/local/bin/solc

      - name: Set up Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Generate Solidity CFG
        run: |
          mkdir -p work/
          stack build --profile
          solc --combined-json ast examples/etherscan.io/CryptoKittiesCore.sol | stack exec -- ea-analyze
          find work/ -name "*.dot" -exec dot -Tpng -O {} \;

      - name: Verify output
        run: |
          # Check if dot files were generated
          test -n "$(find work/ -name '*.dot')" || exit 1
          # Check if PNG files were generated
          test -n "$(find work/ -name '*.dot.png')" || exit 1

  solidity-linter:
    name: Solidity Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo wget -O /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.4.24/solc-static-linux
          sudo chmod +x /usr/local/bin/solc

      - name: Set up Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Run Solidity Linter
        run: |
          stack build
          solc --combined-json ast examples/analysis-benchmark/selfdestruct-over-suicide.sol | stack exec ea-analyze

      - name: Verify output
        run: |
          # The linter should run without errors
          solc --combined-json ast examples/analysis-benchmark/selfdestruct-over-suicide.sol | stack exec ea-analyze
          test $? -eq 0 || exit 1

  evm-cfg:
    name: EVM CFG Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Generate EVM CFG
        run: |
          mkdir -p work/
          stack build
          cat examples/etherscan.io/CryptoKittiesSalesAuction.evm | stack exec -- ea-bytecode-vis --outDot=work/tmp.dot
          dot -Tpng work/tmp.dot -O

      - name: Verify output
        run: |
          # Check if dot file was generated
          test -f work/tmp.dot || exit 1
          # Check if PNG file was generated
          test -f work/tmp.dot.png || exit 1